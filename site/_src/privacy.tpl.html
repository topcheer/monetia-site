<!DOCTYPE html>
<html lang="<!--LANG-->">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--TITLE--></title>
<meta name="description" content="<!--DESC-->">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--HEAD-->
<style>
:root{--navy:#08070F;--purple:#1A1440;--gold:#E9C46A;--gold-l:#F2C14E;--text:#F6F2EA;
  --text2:rgba(246,242,234,.66);--text3:rgba(246,242,234,.42);--glass:rgba(255,255,255,.045);--stroke:rgba(246,242,234,.10)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Inter",sans-serif;
  background:radial-gradient(900px 600px at 80% -10%,rgba(58,30,110,.5),transparent 60%),linear-gradient(160deg,var(--navy),var(--purple),var(--navy));color:var(--text);line-height:1.8}
.topnav{max-width:760px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.topnav .brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond","Didot","Songti SC",serif;font-size:22px;font-weight:600;color:var(--text);text-decoration:none}
.topnav .brand img{width:26px;height:26px}
.topnav .right{display:flex;gap:18px;align-items:center}
.topnav a.back{color:var(--text3);font-size:13px;text-decoration:none;letter-spacing:.08em}
.topnav a.back:hover,.topnav a.lang:hover{color:var(--gold-l)}
.topnav a.lang{color:var(--muted);font-size:12px;letter-spacing:.14em;font-weight:600;padding:6px 11px;border:1px solid var(--stroke);border-radius:999px;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:56px 24px 80px}
h1{font-size:30px;margin-bottom:4px} h1 em{font-style:normal;color:var(--gold-l)}
.date{color:var(--text3);font-size:13px;margin-bottom:36px}
h2{font-size:19px;color:var(--gold-l);margin:32px 0 10px}
p,li{color:var(--text2);font-size:15px} ul{padding-left:22px} li{margin-bottom:6px}
b{color:var(--text)}
footer{color:var(--text3);text-align:center;padding:26px;font-size:13px}
a{color:var(--gold-l)}
</style>
</head>
<body>
<div class="topnav">
  <a class="brand" href="<!--HOME-->"><img src="/assets/brand/app-icon.png" alt="">Moneta</a>
  <div class="right"><a class="lang" href="<!--OTHER-->" hreflang="<!--OTHER-HREFLANG-->" lang="<!--OTHER-HREFLANG-->"><!--OTHER-LABEL--></a><a class="back" href="<!--HOME-->"><!--BACK--></a></div>
</div>
<div class="wrap">
<h1><!--H1--></h1>
<div class="date"><!--DATE--></div>
<!--BODY-->
</div>
<footer>© 2026 Moneta · <a href="<!--HOME-->"><!--FOOT-HOME--></a> · <a href="<!--SUPPORT-->"><!--FOOT-SUPPORT--></a></footer>
</body>
</html>
