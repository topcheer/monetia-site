<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneta — Support</title>
<meta name="description" content="Moneta support: voice booking, receipt recognition, iCloud sync, exchange rates, AI providers and CSV export.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--LANG-->
<style>
:root{--navy:#08070F;--purple:#1A1440;--gold:#E9C46A;--gold-l:#F2C14E;--text:#F6F2EA;
  --text2:rgba(246,242,234,.66);--text3:rgba(246,242,234,.42);--glass:rgba(255,255,255,.045);--stroke:rgba(246,242,234,.10)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Inter",sans-serif;
  background:radial-gradient(900px 600px at 80% -10%,rgba(58,30,110,.5),transparent 60%),linear-gradient(160deg,var(--navy),var(--purple),var(--navy));color:var(--text);line-height:1.8}
.topnav{max-width:760px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.topnav .brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond","Didot","Songti SC",serif;font-size:22px;font-weight:600;color:var(--text);text-decoration:none}
.topnav .brand img{width:26px;height:26px}
.topnav a.back{color:var(--text3);font-size:13px;text-decoration:none;letter-spacing:.08em}
.topnav a.back:hover{color:var(--gold-l)}
.wrap{max-width:760px;margin:0 auto;padding:24px 24px 64px}
h1{font-size:34px;margin-bottom:8px}h1 em{font-style:normal;color:var(--gold-l)}
p.sub{color:var(--text2);margin-bottom:40px}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:24px;margin-bottom:18px}
.card b{color:var(--gold-l)}
.card p{color:var(--text2);margin-top:6px}
a{color:var(--gold-l)}
code{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px;font-size:13px}
footer{color:var(--text3);text-align:center;padding:30px;font-size:13px}
</style>
</head>
<body>
<div class="topnav"><a class="brand" href="/"><img src="/assets/brand/app-icon.png" alt="">Moneta</a><a class="back" href="/">← Home</a></div>
<div class="wrap">
  <h1><!--H1--></h1>
  <p class="sub"><!--SUB--></p>
  <!--FAQ-->
  <!--CONTACT-->
</div>
<footer>© 2026 Moneta</footer>
</body>
</html>
